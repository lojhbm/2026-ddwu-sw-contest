server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: school-calendar

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  jackson:
    time-zone: Asia/Seoul

logging:
  level:
    root: INFO
