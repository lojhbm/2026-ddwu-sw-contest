server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: school-calendar

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      # 스키마를 자동 변경하지 않습니다. 엔티티에 맞는 테이블을 먼저 생성하세요.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  jackson:
    time-zone: Asia/Seoul

logging:
  level:
    root: INFO
